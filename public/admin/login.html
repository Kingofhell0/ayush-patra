<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Ayush Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <img class="brand-logo" src="/img/logo.png" alt="Ayush Patra logo" width="64" height="64" />
    <p class="eyebrow">PRIVATE AREA</p>
    <h1>Admin Login</h1>
    <p class="muted">Manage your portfolio from one place.</p>

    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" required />

      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <div id="codeWrap" hidden>
        <label for="code">6-digit authenticator code</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*" />
      </div>

      <button type="submit" class="primary-btn">Login</button>
      <p id="loginMessage" class="message"></p>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
